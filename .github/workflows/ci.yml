name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, unit tests and integration tests (embedded Tomcat)
        run: mvn -B -ntp verify
      - name: Build the demo application for the server smoke tests
        if: matrix.java == '17'
        run: mvn -B -ntp -q -f examples/demo-app/pom.xml package
      - name: Keep the artifacts for the server smoke tests
        if: matrix.java == '17'
        uses: actions/upload-artifact@v7
        with:
          name: rocoto
          path: |
            examples/demo-app/target/demo-app.war
            rocoto-war/target/rocoto.war
            rocoto-tools/target/rocoto-tools.jar
            rocoto-undertow/target/rocoto-undertow-*-all.jar
            rocoto-netty/target/rocoto-netty-*-all.jar
          retention-days: 7

  native-architectures:
    # rocoto.war is architecture independent bytecode; build and run all tests natively on
    # amd64 (job "build") and arm64 (Linux and Apple Silicon) anyway. GitHub no longer offers Intel
    # macOS runners (macos-13 stayed queued forever). windows-latest proves that nothing depends on
    # POSIX file permissions, "/" as separator or LF line ends.
    name: Build and tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, windows-latest]   # arm64 Linux, Apple Silicon, Windows (amd64 Linux: job "build")
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: CPU architecture
        shell: bash
        run: uname -m
      - name: Build, unit tests and integration tests (embedded Tomcat)
        run: mvn -B -ntp verify

  architectures:
    name: One WAR on linux/arm64 and linux/amd64
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8
        with:
          name: rocoto
      - uses: docker/setup-qemu-action@v4
      - name: Run
        run: ci/arch/arch-test.sh

  tomcat-versions:
    name: Tomcat ${{ matrix.tag }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # oldest 10.1, a middle one, and 10.0 (Jakarta EE 9, end of life upstream - best effort)
        tag: ['10.0.27-jdk17', '10.1.0-jdk17', '10.1.20-jdk17', '10.1-jdk25']
    env:
      TOMCAT_IMAGE: tomcat:${{ matrix.tag }}
      # The 2022 images bundle JDK 17.0.4, whose container detection throws a NullPointerException
      # on current kernels with cgroup v2 (JDK-8287073, fixed in 17.0.5): the java.lang MXBeans
      # are then never registered. Not a Rocoto problem - switch the detection off for old images.
      TOMCAT_JAVA_OPTS: ${{ startsWith(matrix.tag, '10.1.0') && '-XX:-UseContainerSupport' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8
        with:
          name: rocoto
      - name: Run
        run: ci/arch/arch-test.sh amd64

  wildfly:
    name: Smoke test on a real WildFly (Elytron)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8
        with:
          name: rocoto
      - name: Run
        run: ci/wildfly/smoke-test.sh

  wildfly-cli-scripts:
    name: Elytron CLI scripts on a real WildFly (realm, mTLS/OCSP, stapling, OIDC)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8
        with:
          name: rocoto
      - name: Run
        run: ci/wildfly/cli-scripts-test.sh

  payara:
    name: Smoke test on ${{ matrix.flavor }} (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavor: payara, image: 'payara/server-full:6.2025.11-jdk21' }
          - { flavor: payara, image: 'payara/server-full:7.2026.9-jdk25' }
          - { flavor: glassfish, image: 'ghcr.io/eclipse-ee4j/glassfish:7.1.0' }
          - { flavor: glassfish, image: 'ghcr.io/eclipse-ee4j/glassfish:8.0.4' }
    env:
      FLAVOR: ${{ matrix.flavor }}
      PAYARA_IMAGE: ${{ matrix.image }}
      GLASSFISH_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8
        with:
          name: rocoto
      - name: Run
        run: ci/payara/smoke-test.sh

  jetty:
    name: Smoke test on a real Jetty (${{ matrix.image }}, WebSocket ${{ matrix.websocket }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'jetty:12.0-jdk17', websocket: 'on', login: hash }
          - { image: 'jetty:12.1-jdk25', websocket: 'on', login: hash }
          - { image: 'jetty:12.1-jdk17', websocket: 'off', login: none }
    env:
      JETTY_IMAGE: ${{ matrix.image }}
      WEBSOCKET: ${{ matrix.websocket }}
      LOGIN_SERVICE: ${{ matrix.login }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8
        with:
          name: rocoto
      - name: Run
        run: ci/jetty/smoke-test.sh

  liberty:
    name: Smoke test on a real Open Liberty (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - 'open-liberty:full-java17-openj9'
          - 'icr.io/appcafe/open-liberty:full-java21-openj9-ubi-minimal'
    env:
      LIBERTY_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8
        with:
          name: rocoto
      - name: Run
        run: ci/liberty/smoke-test.sh

  tomee:
    name: Smoke test on a real Apache TomEE (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['tomee:10.1-jre17-plume', 'tomee:10.1-jre21-Temurin-webprofile']
    env:
      TOMEE_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8
        with:
          name: rocoto
      - name: Run
        run: ci/tomee/smoke-test.sh

  powershell-examples:
    # The PowerShell examples for Windows users, run with PowerShell 7 (preinstalled on the runner)
    # against the tomcat-builtin example. Windows runners cannot start Linux containers.
    name: PowerShell examples (test.ps1, rocoto-client.ps1)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8
        with:
          name: rocoto
      - name: Start examples/tomcat-builtin
        run: make -C examples/tomcat-builtin up
      - name: test.ps1
        shell: pwsh
        run: ./examples/tomcat-builtin/test.ps1
      - name: rocoto-client.ps1 (read, bulk, exec, SSE, WebSocket)
        shell: pwsh
        run: |
          $bash = Get-Content -Raw examples/tomcat-builtin/test.sh
          $env:ROCOTO_USER = 'otto'
          $env:ROCOTO_PASSWORD = [regex]::Match($bash, '(?m)^PASSWORD="([^"]+)"').Groups[1].Value
          $out = ./examples/clients/powershell/rocoto-client.ps1
          $out
          if (-not ($out -match '"operation":"drainQueue"')) { throw 'exec did not answer' }
          if (@($out -match '^value ').Count -ne 3) { throw 'expected three SSE values' }
          if (@($out -match '"id":"threads"').Count -ne 3) { throw 'expected three WebSocket values' }
      - name: Server log on failure
        if: failure()
        run: make -C examples/tomcat-builtin logs

  embedded:
    name: Undertow and Netty without a servlet container (mounted, standalone TLS, Java agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build
        run: mvn -B -ntp -q install -DskipTests
      - name: Run
        run: ci/embedded/smoke-test.sh

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Relative links
        run: python3 ci/docs/check-links.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Mermaid diagrams
        run: ci/docs/check-mermaid.sh
