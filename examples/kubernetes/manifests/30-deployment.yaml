apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocoto-demo
  namespace: rocoto-demo
  labels:
    app.kubernetes.io/name: rocoto-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rocoto-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rocoto-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: tomcat
          image: registry.example.com/rocoto-tomcat:0.1.1   # built from ../image/Dockerfile
          ports:
            - name: https
              containerPort: 8443
          env:
            - name: ROCOTO_CONFIG
              value: /etc/rocoto/rocoto.yaml
            - name: CATALINA_OPTS
              value: "-XX:MaxRAMPercentage=75"
          volumeMounts:
            - name: config
              mountPath: /etc/rocoto
              readOnly: true
            - name: users
              mountPath: /etc/rocoto-secrets
              readOnly: true
            - name: tls
              mountPath: /etc/rocoto-tls
              readOnly: true
          startupProbe:
            httpGet: { path: /rocoto/api/v1/health/live, port: https, scheme: HTTPS }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /rocoto/api/v1/health/live, port: https, scheme: HTTPS }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /rocoto/api/v1/health/live, port: https, scheme: HTTPS }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: rocoto-config
        - name: users
          secret:
            secretName: rocoto-users
            defaultMode: 0440        # owner root, group 0 = the group of the container user
        - name: tls
          secret:
            secretName: rocoto-tls   # kubernetes.io/tls: tls.crt, tls.key (+ ca.crt) - see README
            defaultMode: 0440
